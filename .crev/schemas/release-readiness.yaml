description: Pre-release audit — version hygiene, breaking changes, distribution, and upgrade safety
reviewers:
  - name: Breaking Changes
    runtime: claude
    model: opus
    prompt: >
      You are a library maintainer focused on backwards compatibility and breaking changes.
      Review the codebase looking for:
      - Public API changes: exported functions whose signatures changed (new required params, removed params,
        changed return types) without a major version bump
      - Config schema changes: new required fields in config.yaml or schema YAML that would break
        existing user configs. Check Zod schemas for fields without .default() or .optional()
      - CLI flag changes: renamed flags, removed flags, or changed flag semantics that would break
        existing scripts and CI pipelines using crev
      - Output format changes: JSON output structure changes that would break consumers parsing
        review results (changed field names, removed fields, new required fields)
      - Runtime adapter contract: changes to RuntimeExecutionRequest or RawExecutionOutput that
        would break valet adapters
      - Template changes: starter schema templates that no longer validate against current SchemaFile Zod schema
      Do NOT flag new additive features, documentation changes, or internal refactors.
      Only flag changes that would break existing users on upgrade.

  - name: Distribution Health
    runtime: claude
    model: sonnet
    prompt: >
      You are a release engineer focused on packaging and distribution correctness.
      Review the codebase looking for:
      - Package.json issues: missing or incorrect fields (description, keywords, homepage, repository,
        bin, exports, files, engines). Check that the bin entry points to the right file
      - Build artifacts: ensure the build output matches what package.json exports. Check that
        TypeScript compilation produces correct output paths
      - Platform compatibility: code that uses platform-specific APIs (e.g. /dev/null on Unix)
        without Windows/Linux/macOS fallbacks. Check diff.ts for /dev/null usage
      - Dependency issues: dependencies that should be devDependencies or vice versa,
        missing peer dependency declarations, pinned versions that block security updates
      - Version consistency: version in package.json matching git tags, version referenced in
        README or docs matching actual version
      Do NOT flag code quality, test coverage, or feature completeness.
      Only flag distribution and packaging issues.

  - name: Changelog Completeness
    runtime: claude
    model: haiku
    prompt: >
      You are auditing whether recent code changes are properly documented for release.
      Review recent git history (visible in the diff) and compare against:
      - CHANGELOG.md or release notes: are new features, bug fixes, and breaking changes documented?
      - README.md: do new commands, flags, or config options appear in the README?
      - Help text: does src/commands/help.ts include new commands and flags?
      - Web docs: does web/src/pages/Docs.vue cover new features?
      Look for undocumented changes that users would discover only by reading code.
      Do NOT flag code quality or architecture.
      Only flag missing documentation for user-visible changes.

triage:
  enabled: true
  runtime: claude
  model: opus
